name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: macos-latest
            target: mac
          - os: windows-latest
            target: win
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run build

      - name: Package release
      run: npx electron-builder --${{ matrix.target }} --x64        env:


    - name: Upload Release Assets
      uses: softprops/action-gh-release@v1
      with:
        files: |
          release/Jarvis-Setup.exe
          release/Jarvis-Setup.dmg
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
