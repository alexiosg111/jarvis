appId: "com.jarvis.hub"
productName: "Jarvis Hub"

directories:
  output: "release"
  buildResources: "resources"

files:
  - "dist/**"
  - "package.json"

mac:
  target:
    - "dmg"
  category: "public.app-category.productivity"
  artifactName: "jarvis-hub-installer.${ext}"
win:
  target:
    - "nsis"
  artifactName: "jarvis-hub-installer.${ext}"
linux:
  target:
    - "AppImage"
